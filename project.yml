name: RobertLangOrigami
options:
  bundleIdPrefix: com.airsoto
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    INFOPLIST_KEY_CFBundleShortVersionString: "1.1.0"
    INFOPLIST_KEY_CFBundleVersion: "2"
    TARGETED_DEVICE_FAMILY: '1'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: Robert J. Lang Origami
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: RobertLang/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  RobertLangOrigami:
    type: application
    platform: iOS
    sources:
      - path: RobertLang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airsoto.robertlangorigami
        CODE_SIGN_STYLE: Automatic
