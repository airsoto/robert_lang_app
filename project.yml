name: RobertLangOrigami
options:
  bundleIdPrefix: com.airsoto
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: '1'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: Robert J. Lang Origami
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  RobertLangOrigami:
    type: application
    platform: iOS
    sources:
      - path: RobertLang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airsoto.robertlangorigami
        CODE_SIGN_STYLE: Automatic
